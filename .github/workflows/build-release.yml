name: Validate and package
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2022
            architecture: x64
          - target: macos-arm64
            os: macos-15
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
      - name: Check runner and runtime architecture
        shell: bash
        run: |
          node -e "if(process.version!=='v24.11.1'||process.arch!=='${{ matrix.architecture }}')process.exit(1);console.log(process.platform,process.arch,process.version)"
      - name: Install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Check app, lockfile and tag version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: node scripts/check-version.mjs
      - name: Check source tree before packaging
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Typecheck, rules and API tests
        run: |
          npm run typecheck
          npm test
      - name: Build app
        run: npm run build
      - name: Package macOS
        if: matrix.target == 'macos-arm64'
        run: npm run package:mac
      - name: Package Windows
        if: matrix.target == 'windows-x64'
        run: npm run package:windows
      - name: Smoke from extracted macOS ZIP and bundled Node
        if: matrix.target == 'macos-arm64'
        shell: bash
        run: |
          mkdir -p '/tmp/工作台 验证'
          unzip -q release/后来居上组管理后台-v*-macos-arm64.zip -d '/tmp/工作台 验证'
          package_dir=$(find '/tmp/工作台 验证' -maxdepth 1 -type d -name '后来居上组管理后台-*' | head -1)
          "$package_dir/runtime/node" scripts/smoke-package.mjs "$package_dir"
      - name: Smoke from extracted Windows ZIP and bundled Node
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $archive = Get-ChildItem release/后来居上组管理后台-v*-windows-x64.zip | Select-Object -First 1
          Expand-Archive -Path $archive.FullName -DestinationPath 'C:\workbench smoke' -Force
          $package = Get-ChildItem 'C:\workbench smoke' -Directory | Where-Object Name -Like '后来居上组管理后台-*' | Select-Object -First 1
          & "$($package.FullName)\runtime\node.exe" scripts/smoke-package.mjs "$($package.FullName)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/后来居上组管理后台-v*.zip
          if-no-files-found: error
          retention-days: 7
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
          merge-multiple: true
      - name: Prepare checksums and draft notes
        run: |
          cd artifacts
          sha256sum 后来居上组管理后台-v*.zip > SHA256SUMS.txt
          printf '%s\n' \
            'V0.3.2：工作台增加未来三天交付提醒；保留现有农场界面和数据结构。' \
            '' \
            '成品包：macOS arm64（Apple 芯片）及 Windows x64。请下载与设备架构对应的 ZIP，并用 SHA256SUMS.txt 校验；Source code ZIP 不是免安装运行包。' \
            '' \
            'GitHub Actions 已在 macOS arm64 与 Windows x64 runner 上安装、测试、构建、打包，并从解压包验证启动/停止脚本、SQLite 写入、备份下载、重启保留、前端路由和本地素材。' \
            '办公 Mac 首次部署、真实 Windows 启动、Mac 到 Windows 局域网访问、防火墙和目标设备离线运行仍待对应设备验收。应用运行无需连接 GitHub；GitHub 不保存正式业务数据库。' \
            > RELEASE_NOTES.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/后来居上组管理后台-v*.zip artifacts/SHA256SUMS.txt --draft --verify-tag --title "后来居上组管理后台 $TAG" --notes-file artifacts/RELEASE_NOTES.txt
